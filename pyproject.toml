[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-to-robot-actions"
version = "0.3.0"
description = "Natural language prompts to robot actions (Claude, Bedrock, Gazebo, Nav2, MoveIt)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lazaro Gomez Vitolo", email = "lazarogvitolo@gmail.com" }]
keywords = ["robotics", "ros2", "gazebo", "claude", "tool-calling", "moveit", "nav2"]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40.0"]
bedrock = ["boto3>=1.34.0"]
config = ["pyyaml>=6.0"]
yolo = ["ultralytics>=8.0", "numpy"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.8", "pyyaml>=6.0"]
all = ["anthropic>=0.40.0", "boto3>=1.34.0", "pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.8", "pyyaml>=6.0"]

[project.scripts]
ptra = "src.cli:main"

[project.urls]
Homepage = "https://github.com/Lazaro549/prompt-to-robot-actions"
Repository = "https://github.com/Lazaro549/prompt-to-robot-actions"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=50"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["src"]
